# Supabase project config (used by CLI for deploy/link)
# See: https://supabase.com/docs/guides/cli/config

[functions.send-company-admin-invite]
# Disable JWT verification so the app can invoke this function after RLS has
# already allowed creating the invitation. The function only sends an email.
verify_jwt = false

[functions.confirm-invited-user]
# Called by the client right after signUp in the invite flow (user may not be confirmed yet).
verify_jwt = false

[functions.ensure-room-images]
# We validate the JWT manually inside the function (using auth.getUser),
# so platform-level verification is not required. This avoids 'Invalid JWT'
# errors when calling from the browser with the access token.
verify_jwt = false

[functions.delete-company-admin]
# We'll validate the JWT manually inside the function (like ensure-room-images)
# so platform-level JWT verification doesn't block the request.
verify_jwt = false
