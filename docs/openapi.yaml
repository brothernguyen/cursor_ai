openapi: 3.0.3
info:
  title: Meeting Room App API
  description: |
    API surface for the Meeting Room application. Implemented via **Supabase** (Auth, PostgREST, Edge Functions).

    **Swagger UI / Editor:** Use the **Authorize** button once and enter **apikey** (anon key) and **bearerAuth** (JWT after login).
    Per-operation header fields were removed from this spec so you are not prompted for the same headers on every request.
    The Supabase HTTP API still requires the `apikey` header on every call—that cannot be disabled client-side.

    **Empty `[]` on `GET /rest/v1/companies`:** PostgREST returns HTTP 200 with an empty array when **RLS** hides all rows.
    For this endpoint, `profiles.role` must be `sys_admin` for `auth.uid()` (see `my_profile()` in RLS). If your user has no row in `public.profiles` or `role` is not `sys_admin`, you will see `[]`.
    Bootstrap: `insert into public.profiles (id, email, role) select id, email, 'sys_admin' from auth.users where email = 'your@email.com';` (run in SQL Editor once).

    **JWT `user.role` vs application role:** The Auth token response includes `user.role` values such as **`authenticated`** (or **`anon`** when logged out). That is the Supabase JWT role for PostgREST/RLS, **not** your product role. Application roles **`sys_admin`**, **`company_admin`**, and **`employee`** are stored in **`public.profiles.role`**. After login, read them via **`GET /rest/v1/profiles`** (or the app’s `AuthService`), not from the raw token JSON’s `user.role`.

    **PostgREST query filters (Supabase `/rest/v1/...`):** Column filters must use an **operator**, not a bare value. Use **`eq.`** for equality, e.g. `company_id=eq.43becd5c-...` and `status=eq.active`. Sending `company_id=<uuid>` without `eq.` returns **400** with `PGRST100` (“failed to parse filter”).
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: https://lvoncirunpbomolblvuo.supabase.co
    description: Supabase project (replace with your project URL)
  - url: https://lvoncirunpbomolblvuo.supabase.co/functions/v1
    description: Supabase Edge Functions

tags:
  - name: Auth
    description: Authentication and session
  - name: Companies
    description: Company CRUD (sys_admin)
  - name: Company Admins
    description: Company admin invitations and management
  - name: Invitations
    description: Invitation and registration flow
  - name: Rooms
    description: Meeting rooms (company_admin)
  - name: Employees
    description: Employees (company_admin)
  - name: Edge Functions
    description: Custom Supabase Edge Functions

# Default for PostgREST + authenticated routes: anon key + user JWT (set once via Authorize in Swagger UI)
security:
  - apiKeyAuth: []
    bearerAuth: []

paths:
  # ---- Auth ----
  /auth/v1/token?grant_type=password:
    post:
      tags: [Auth]
      summary: Admin login
      description: |
        Supabase Auth sign-in. Returns a session with `access_token` and a `user` object whose **`user.role`** is the JWT role (**`authenticated`**), not the app role.

        The Angular app then loads **`sys_admin` / `company_admin` / `employee`** from **`public.profiles`** (`role`, `company_id`). In browser DevTools, inspect the **`profiles`** request as well as **`token`**.
      operationId: adminLogin
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: |
            Session with `access_token`. Response `user.role` is **`authenticated`** (JWT/RLS). Use **`GET /rest/v1/profiles`** for `sys_admin` / `company_admin` / `employee`.
        '400':
          description: Invalid credentials or email_not_confirmed

  /auth/v1/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: Signed out

  /auth/v1/user:
    get:
      tags: [Auth]
      summary: Get current session / user
      description: Returns Supabase session/user; **`user.role`** remains **`authenticated`** for logged-in users. Load **`profiles.role`** separately for the app role.
      operationId: getSession
      responses:
        '200':
          description: Current session and user (JWT role in `user.role`, not `profiles.role`)

  # ---- Companies (Supabase PostgREST: rest/v1/companies) ----
  /rest/v1/companies:
    get:
      tags: [Companies]
      summary: List all companies
      description: |
        Select * from companies, optional filter by status. Order by created_at desc.
        **RLS:** Rows are returned only when `public.profiles.role = 'sys_admin'` for `auth.uid()` (policy `companies_sys_admin_all`).
        Use **Authorize** with anon **apikey** + **Bearer** token from the same user’s login. If the JWT user has no profile row or is not `sys_admin`, response is **`[]`** with HTTP 200 (not an error).
      operationId: getAllCompanies
      parameters:
        - $ref: '#/components/parameters/PostgrestStatusEq'
      responses:
        '200':
          description: List of companies
    post:
      tags: [Companies]
      summary: Create company
      operationId: createCompany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRow'
      responses:
        '201':
          description: Created company

  /rest/v1/companies/{companyId}:
    patch:
      tags: [Companies]
      summary: Update company (or status only)
      operationId: updateCompany
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                address: { type: string }
                phone: { type: string }
                industry: { type: string }
                status: { type: string, enum: [active, inactive] }
                logo_url: { type: string }
      responses:
        '200':
          description: Updated company
    delete:
      tags: [Companies]
      summary: Delete company
      operationId: deleteCompany
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

  # ---- Profiles (used after login) ----
  /rest/v1/profiles:
    get:
      tags: [Auth]
      summary: Get profile by user id
      description: |
        Select **`role`** (`sys_admin`, `company_admin`, `employee`), **`company_id`**, and other columns for the user. This is the **application role** source of truth after login—not the Auth response’s `user.role` (`authenticated`).
      operationId: getProfile
      parameters:
        - $ref: '#/components/parameters/PostgrestProfileIdEq'
      responses:
        '200':
          description: Profile row

  # ---- Company Admins ----
  /rest/v1/company_admins:
    get:
      tags: [Company Admins]
      summary: List company admins for a company
      description: |
        Select * where company_id = :id, order by created_at desc.
        **Query filter:** PostgREST requires `company_id=eq.<uuid>`, not a bare UUID (see global **PostgREST query filters** note).
      operationId: getCompanyAdmins
      parameters:
        - $ref: '#/components/parameters/PostgrestCompanyIdEq'
      responses:
        '200':
          description: List of company admins
    post:
      tags: [Company Admins]
      summary: Create company admin (invite)
      description: Inserts row then creates invitation and calls Edge Function to send email.
      operationId: createCompanyAdmin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [company_id, email]
              properties:
                company_id: { type: string, format: uuid }
                email: { type: string, format: email }
                companyName: { type: string, description: 'Optional, for email body' }
      responses:
        '201':
          description: Created; invitation email sent

  /rest/v1/company_admins/{adminId}:
    patch:
      tags: [Company Admins]
      summary: Update company admin
      operationId: updateCompanyAdmin
      parameters:
        - name: adminId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                status: { type: string, enum: [active, inactive, pending] }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Company Admins]
      summary: Delete company admin
      operationId: deleteCompanyAdmin
      parameters:
        - name: adminId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

  # ---- Invitations ----
  /rest/v1/rpc/get_invitation_by_token:
    post:
      security:
        - apiKeyAuth: []
      tags: [Invitations]
      summary: Get invitation by token
      description: Returns invitation row if token valid and not expired. Used by register page.
      operationId: getInvitationByToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [t]
              properties:
                t: { type: string, description: 'Invitation token from email link' }
      responses:
        '200':
          description: Invitation (email, role, company_id, expires_at)
        '404':
          description: Invalid or expired token

  # ---- Auth signUp (invitation flow) ----
  /auth/v1/signup:
    post:
      security:
        - apiKeyAuth: []
      tags: [Invitations]
      summary: Sign up (accept invitation)
      description: Called with invitation email + new password. Then app upserts profile, updates company_admins, and calls confirm-invited-user Edge Function.
      operationId: acceptInvitationSignUp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                options:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        first_name: { type: string }
                        last_name: { type: string }
                        phone: { type: string }
      responses:
        '200':
          description: User created

  # ---- Rooms ----
  /rest/v1/rooms:
    get:
      tags: [Rooms]
      summary: List rooms for current company
      operationId: getAllRooms
      parameters:
        - $ref: '#/components/parameters/PostgrestCompanyIdEq'
      responses:
        '200':
          description: List of rooms
    post:
      tags: [Rooms]
      summary: Create room
      operationId: createRoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomRow'
      responses:
        '201':
          description: Created room

  /rest/v1/rooms/{roomId}:
    patch:
      tags: [Rooms]
      summary: Update room
      operationId: updateRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomRow'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Rooms]
      summary: Delete room
      operationId: deleteRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

  # ---- Employees ----
  /rest/v1/employees:
    get:
      tags: [Employees]
      summary: List employees for current company
      operationId: getAllEmployees
      parameters:
        - $ref: '#/components/parameters/PostgrestCompanyIdEq'
      responses:
        '200':
          description: List of employees
    post:
      tags: [Employees]
      summary: Invite employee
      operationId: inviteEmployee
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, company_id]
              properties:
                email: { type: string, format: email }
                role: { type: string, default: employee }
                company_id: { type: string, format: uuid }
                status: { type: string, default: inactive, enum: [active, inactive] }
      responses:
        '201':
          description: Created

  /rest/v1/employees/{employeeId}:
    patch:
      tags: [Employees]
      summary: Update employee
      operationId: updateEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                department: { type: string }
                role: { type: string }
                status: { type: string, enum: [active, inactive] }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Employees]
      summary: Delete employee
      operationId: deleteEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

  # ---- Edge Functions ----
  /functions/v1/send-company-admin-invite:
    post:
      security: []
      tags: [Edge Functions]
      summary: Send company admin invitation email
      description: Invoked by app after creating company_admin + invitation. Sends email via Resend with register link. No JWT required (verify_jwt = false).
      operationId: sendCompanyAdminInvite
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email: { type: string, format: email }
                token: { type: string, description: 'Invitation token' }
                companyName: { type: string }
      responses:
        '200':
          description: Email sent
        '500':
          description: FRONTEND_URL invalid or Resend error

  /functions/v1/confirm-invited-user:
    post:
      security: []
      tags: [Edge Functions]
      summary: Confirm invited user email
      description: Called after signUp in invite flow. Sets email_confirm = true for the user so they can sign in. No JWT required.
      operationId: confirmInvitedUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, userId]
              properties:
                token: { type: string }
                userId: { type: string, format: uuid }
      responses:
        '200':
          description: User confirmed
        '400':
          description: Invalid token or user mismatch

components:
  parameters:
    # PostgREST: ?column=eq.value — bare values cause 400 PGRST100
    PostgrestCompanyIdEq:
      name: company_id
      in: query
      required: true
      description: |
        Equality filter: **`eq.`** + company UUID. Example: `eq.43becd5c-e9c4-44ca-8741-5aa3584e26d5`.
        In Swagger **Try it out**, paste the full value including the `eq.` prefix.
      schema:
        type: string
        example: eq.43becd5c-e9c4-44ca-8741-5aa3584e26d5
    PostgrestProfileIdEq:
      name: id
      in: query
      required: true
      description: |
        Equality filter: **`eq.`** + profile (user) UUID. Example: `eq.43becd5c-e9c4-44ca-8741-5aa3584e26d5`.
      schema:
        type: string
        example: eq.43becd5c-e9c4-44ca-8741-5aa3584e26d5
    PostgrestStatusEq:
      name: status
      in: query
      required: false
      description: Optional. Equality filter — use `eq.active` or `eq.inactive`.
      schema:
        type: string
        enum: [eq.active, eq.inactive]
        example: eq.active

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Supabase anon key (required for Supabase endpoints)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access_token (from login/session)

  schemas:
    CompanyRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logo_url: { type: string, nullable: true }
        address: { type: string }
        phone: { type: string, nullable: true }
        industry: { type: string }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoomRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer }
        available_from: { type: string }
        available_to: { type: string }
        location: { type: string }
        timezone: { type: string, default: UTC }
