@if (company) {
<div class="modal-overlay">
  <div
    class="bg-white dark:bg-slate-900 rounded-xl shadow-2xl room-modal-panel w-full mx-4 max-h-[90vh] overflow-y-auto border border-gray-200 dark:border-slate-700"
  >
    <div class="room-modal-header">
      <h2 class="room-modal-title">{{ 'modals.deleteCompany' | translate }}</h2>
      <button (click)="onClose()" class="modal-close-button" type="button" [attr.aria-label]="'modals.ariaClose' | translate">
        <svg
          class="modal-close-icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
    <div class="room-modal-body">
      <div class="room-modal-form">
        <p class="room-modal-message">
          {{ 'modals.deleteCompanyConfirmName' | translate: { name: company.name } }}
        </p>
        <p class="room-modal-subtext">
          {{ 'modals.deleteCompanyWarning' | translate }}
        </p>
        <div class="room-modal-actions">
          <button
            type="button"
            (click)="onCancel()"
            [disabled]="deleting"
            class="room-modal-footer-btn border border-gray-300 text-gray-800 dark:border-slate-700 dark:text-slate-100 hover:bg-gray-50 dark:hover:bg-slate-800 dark:hover:text-slate-100 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ 'common.cancel' | translate }}
          </button>
          <button
            type="button"
            (click)="onDelete()"
            [disabled]="deleting"
            class="room-modal-footer-btn bg-red-600 text-white hover:bg-red-700 disabled:bg-gray-300 dark:disabled:bg-slate-700 disabled:cursor-not-allowed"
          >
            @if (deleting) {
            {{ 'modals.deleting' | translate }}
            } @else {
            {{ 'modals.deleteCompanyButton' | translate }}
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
}
